<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta property="og:title" content="دانلود جزیره فندقی">
  <meta property="og:description" content="جزیره فندقی؛ آموزش و بازی کودک. دانلود از مایکت یا بازار.">

  <title>دانلود جزیره فندقی</title>
  <style>
    :root { color-scheme: light; --bg:#b9efff; --panel:#fffdf3; --text:#26365b; --muted:#667596; }
    @font-face { font-family:Vazirmatn; src:url("../assets/fonts/Vazirmatn-Variable.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:swap; }
    * { box-sizing:border-box; }
    body { position:relative; isolation:isolate; overflow-x:hidden; margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Vazirmatn, Tahoma, Arial, sans-serif; color:var(--text); background:linear-gradient(180deg,#8fe4ff 0%,#c7f5ff 48%,#fff0c9 100%); }
    body::before, body::after { content:""; position:fixed; z-index:-1; width:260px; height:260px; border-radius:50%; filter:blur(35px); opacity:.5; pointer-events:none; }
    body::before { top:8%; right:-110px; background:#ffdc67; animation:ambient-drift 11s ease-in-out infinite alternate; }
    body::after { bottom:5%; left:-115px; background:#ff9ed2; animation:ambient-drift 13s ease-in-out infinite alternate-reverse; }
    @keyframes ambient-drift { from { transform:translate3d(0,-12px,0) scale(.92); } to { transform:translate3d(14px,20px,0) scale(1.08); } }
    main { width:min(100%,440px); text-align:center; padding:34px 24px 27px; border:4px solid #ffffff; border-radius:36px; background:linear-gradient(160deg,#fffef8 0%,#fff6d9 100%); box-shadow:0 12px 0 #68c8df,0 25px 55px #3986a744,inset 0 0 0 2px #ffdf8c; animation:panel-arrive .8s ease both; position:relative; overflow:hidden; }
    main::before { content:"✦  ·  ✿  ·  ✦"; position:absolute; top:15px; left:17px; color:#f4b63f; font-size:18px; letter-spacing:3px; transform:rotate(-9deg); opacity:.9; }
    main::after { content:"☁"; position:absolute; right:16px; bottom:10px; color:#9fe5f3; font-size:38px; opacity:.75; pointer-events:none; animation:cloud-bob 4s ease-in-out infinite; }
    @keyframes cloud-bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
    .eyebrow { display:inline-block; margin:0 auto 12px; padding:7px 15px; border:2px solid #ffe19a; border-radius:999px; background:#fff1bf; color:#8d641b; font-size:14px; font-weight:800; box-shadow:0 3px 0 #f7d77f; }
    .icon-wrap { position:relative; width:132px; height:132px; margin:0 auto 18px; display:grid; place-items:center; animation:logo-arrive .95s cubic-bezier(.2,.85,.25,1.25) both; }
    .icon-wrap::before { content:""; position:absolute; inset:3px; border-radius:38px; background:conic-gradient(from 0deg,#ffb8de,#ffd166,#8be7ce,#83dcff,#c8b6ff,#ffb8de); filter:blur(9px); opacity:.85; animation:halo-turn 12s linear infinite; }
    .icon { position:relative; display:block; width:112px; height:112px; object-fit:contain; border-radius:25px; box-shadow:0 10px 30px #f5b83d45; animation:logo-float 3.6s ease-in-out 1s infinite; }
    h1 { animation:title-arrive .7s ease .25s both; }
    @keyframes panel-arrive { from { opacity:0; transform:translateY(18px) scale(.985); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes button-arrive { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes button-shine { 0%,60%,100% { left:-70%; } 80% { left:135%; } }
    @keyframes logo-arrive { 0% { opacity:0; transform:translateY(24px) scale(.68) rotate(-8deg); } 70% { opacity:1; transform:translateY(-4px) scale(1.05) rotate(2deg); } 100% { opacity:1; transform:translateY(0) scale(1) rotate(0); } }
    @keyframes logo-float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
    @keyframes halo-turn { to { transform:rotate(360deg); } }
    @keyframes title-arrive { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    h1 { margin:0; color:#3e4d91; font-size:clamp(32px,8vw,42px); line-height:1.5; text-shadow:0 2px 0 #ffffff; }
    .subtitle { margin:8px 0 25px; color:var(--muted); font-size:clamp(17px,4.4vw,19px); line-height:2; }
    .store { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:14px; width:100%; min-height:60px; margin:13px 0; padding:15px 18px; border:2px solid #ffffff; border-radius:20px; color:#26365b; text-decoration:none; font-size:clamp(18px,4.8vw,21px); font-weight:850; box-shadow:0 6px 0 #d8e3ed,0 12px 20px #6d8caf20; transition:transform .22s ease,filter .22s ease,box-shadow .22s ease; animation:button-arrive .65s cubic-bezier(.2,.8,.2,1) both; }
    .myket { animation-delay:.45s; }
    .bazaar { animation-delay:.62s; }
    .store::after { content:""; position:absolute; top:-50%; bottom:-50%; left:-70%; width:42%; transform:skewX(-20deg); background:linear-gradient(90deg,transparent,#ffffff80,transparent); animation:button-shine 5.5s ease-in-out 2s infinite; }
    .store:hover,.store:focus-visible { transform:translateY(-3px); filter:brightness(1.06); box-shadow:0 10px 0 #00000018,0 18px 30px #00000025; outline:2px solid #ffffffa0; outline-offset:3px; }
    .store:active { transform:translateY(2px) scale(.99); box-shadow:0 3px 0 #00000020; }
    .store-logo { flex:0 0 42px; width:42px; height:42px; object-fit:contain; border-radius:0; background:transparent; padding:0; box-shadow:none; mix-blend-mode:multiply; }
    .store span { line-height:1.6; }
    .myket { background:linear-gradient(135deg,#c9ffd9,#71e5a0); box-shadow:0 6px 0 #4cbe7b,0 12px 20px #6d8caf20; }
    .bazaar { background:linear-gradient(135deg,#fff0b9,#ffc85f); box-shadow:0 6px 0 #e7a83c,0 12px 20px #6d8caf20; }
    .hint { display:inline-block; margin:22px 0 0; padding:8px 13px; border-radius:14px; background:#e9f8ff; color:#58728e; font-size:12px; line-height:1.9; }
    footer { position:relative; z-index:1; margin-top:19px; color:#9a7b51; font-size:14px; font-weight:800; }
    @media (max-width:360px) { body { padding:14px; } main { padding:26px 16px; border-radius:23px; } .icon-wrap { width:116px; height:116px; } .icon { width:100px; height:100px; }  .store { font-size:18px; min-height:62px; gap:10px; } .store-logo { width:38px; height:38px; flex-basis:38px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  </style>
</head>

  </main>
