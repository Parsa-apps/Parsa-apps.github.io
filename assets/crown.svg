<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 86" role="img" aria-label="تاج طلایی">
  <defs>
    <linearGradient id="crown-gold" x1="12" y1="6" x2="108" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="26%" stop-color="#FBD06F"/>
      <stop offset="52%" stop-color="#E9B949"/>
      <stop offset="74%" stop-color="#F2D479"/>
      <stop offset="100%" stop-color="#B07E1F"/>
    </linearGradient>
    <linearGradient id="crown-band" x1="20" y1="58" x2="100" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="40%" stop-color="#E4AC38"/>
      <stop offset="100%" stop-color="#8F6217"/>
    </linearGradient>
    <radialGradient id="gem-red" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FF9E9E"/>
      <stop offset="55%" stop-color="#E13A3A"/>
      <stop offset="100%" stop-color="#8F1212"/>
    </radialGradient>
    <radialGradient id="gem-teal" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#B7F3E6"/>
      <stop offset="55%" stop-color="#2BB3A0"/>
      <stop offset="100%" stop-color="#0E6E60"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- پرتوهای نور پشت تاج -->
  <g opacity="0.35">
    <rect x="56" y="0" width="8" height="20" rx="4" fill="url(#shine)"/>
    <rect x="34" y="4" width="6" height="14" rx="3" fill="url(#shine)"/>
    <rect x="80" y="4" width="6" height="14" rx="3" fill="url(#shine)"/>
  </g>

  <!-- بدنه تاج -->
  <path d="M14 66 L20 24 Q26 34 32 22 L42 46 L52 18 Q56 12 60 18 L70 46 L80 22 Q86 34 92 24 L98 66 Q56 78 14 66 Z"
        fill="url(#crown-gold)" stroke="#8F6217" stroke-width="2" stroke-linejoin="round"/>
  <!-- سایه داخلی پره‌ها -->
  <path d="M26 42 L30 30 Q34 40 38 42 Z" fill="#B07E1F" opacity="0.45"/>
  <path d="M56 44 L60 32 Q64 42 68 44 Z" fill="#B07E1F" opacity="0.45"/>
  <path d="M86 42 L90 30 Q94 40 98 42 Z" fill="#B07E1F" opacity="0.45"/>

  <!-- گوی‌های طلایی نوک پره‌ها -->
  <circle cx="20" cy="21" r="4.5" fill="url(#crown-gold)" stroke="#8F6217" stroke-width="1.5"/>
  <circle cx="60" cy="13" r="5.5" fill="url(#crown-gold)" stroke="#8F6217" stroke-width="1.5"/>
  <circle cx="100" cy="21" r="4.5" fill="url(#crown-gold)" stroke="#8F6217" stroke-width="1.5"/>

  <!-- نگین مرکزی -->
  <circle cx="60" cy="27" r="7" fill="url(#gem-red)" stroke="#7A0E0E" stroke-width="1.5"/>
  <ellipse cx="57.5" cy="24.5" rx="2.6" ry="1.8" fill="#FFFFFF" opacity="0.8"/>

  <!-- نگین‌های جانبی -->
  <circle cx="32" cy="34" r="4.2" fill="url(#gem-teal)" stroke="#0E6E60" stroke-width="1.2"/>
  <circle cx="88" cy="34" r="4.2" fill="url(#gem-teal)" stroke="#0E6E60" stroke-width="1.2"/>

  <!-- نوار پایه -->
  <rect x="10" y="62" width="100" height="14" rx="7" fill="url(#crown-band)" stroke="#8F6217" stroke-width="2"/>
  <rect x="10" y="62" width="100" height="4" rx="2" fill="#FFF3C4" opacity="0.55"/>

  <!-- برق شاین روی تاج -->
  <path d="M18 40 L34 20 L38 24 L22 44 Z" fill="#FFFFFF" opacity="0.5"/>
  <path d="M62 26 L66 20 L69 23 L65 29 Z" fill="#FFFFFF" opacity="0.55"/>
</svg>
