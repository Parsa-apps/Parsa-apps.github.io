<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>صفحه پیدا نشد (۴۰۴) | پارسا اپس — Parsa Apps</title>
<meta name="description" content="صفحه موردنظر شما در وب‌سایت پارسا اپس پیدا نشد. به صفحه اصلی، پروژه‌ها یا بخش تماس بازگردید.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#050c17">
<link rel="canonical" href="https://parsa-apps.github.io/404.html">
<link rel="icon" type="image/svg+xml" href="/assets/crown.svg">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
<link rel="preload" href="/assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<script>
(function () {
  try {
    var saved = localStorage.getItem('parsa-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>
<style>
  .err-stage {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
    text-align: center;
  }
  .err-box {
    max-width: 580px;
    width: 100%;
    padding: clamp(30px, 6vw, 52px);
    border-radius: var(--radius-xl);
    background: var(--bg-surface-strong);
    border: 1px solid var(--border-gold-strong);
    box-shadow: var(--shadow-deep);
  }
  .err-num {
    font-size: clamp(68px, 16vw, 128px);
    font-weight: 900;
    line-height: 1;
    margin: 12px 0 8px;
    background: linear-gradient(180deg, #fff6d4 0%, #f5c34d 52%, #d78f1f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .err-box h1 {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 900;
    color: var(--text-strong);
    margin-bottom: 12px;
  }
  .err-box p {
    font-size: 15px;
    color: var(--text-soft);
    margin-bottom: 26px;
    line-height: 1.9;
  }
  .err-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
<main class="err-stage">
  <div class="err-box">
    <a href="/" aria-label="بازگشت به خانه پارسا اپس">
      <span class="brand-lockup" style="justify-content:center">
        <img src="/assets/crown.svg" alt="" class="brand-crown" width="38" height="28">
        <span class="brand-word">
          <span class="brand-parsa">Parsa</span>
          <span class="brand-apps">Apps</span>
        </span>
      </span>
    </a>
    <div class="err-num">۴۰۴</div>
    <h1>صفحه موردنظر شما در جزیره پارسا اپس پیدا نشد</h1>
    <p>ممکن است نشانی واردشده جابه‌جا شده باشد یا با خطای تایپی همراه باشد. از دکمه‌های زیر می‌توانید مستقیماً به بخش‌های اصلی وب‌سایت بازگردید.</p>
    <div class="err-actions">
      <a href="/" class="btn btn-gold btn-sm">بازگشت به خانه</a>
      <a href="/#projects" class="btn btn-glass btn-sm">مشاهده پروژه‌ها</a>
      <a href="/#contact" class="btn btn-glass btn-sm">تماس با ما</a>
    </div>
  </div>
</main>
<script src="/assets/js/site.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(function () {});
  });
}
</script>
</body>
</html>
