    <!-- Paint the dark canvas before any CSS arrives (no white flash) + emergency fallback styles -->

      /* Emergency kill-switch: after 8s, any stuck preloader overlay is forced hidden via JS, but also via CSS animation as last resort */
      @keyframes parsa-emergency-hide {

        99% { opacity: 1; visibility: visible; }

  <body>
    <div id="root"></div>
    <script>
      // Apply saved language before first paint (set by the language switcher)
      (function () {
        try {
          var l = localStorage.getItem("parsa_lang");
          if (l === "en" || l === "ar" || l === "fa") {
            document.documentElement.lang = l;
            document.documentElement.dir = l === "en" ? "ltr" : "rtl";
          }
        } catch (e) {}
      })();
    </script>
    <script>window.__PARSA_NOT_FOUND__ = location.pathname;</script>
    <script>
      // Robust boot guards: multiple layers to prevent permanent black screen
      (function () {
        var BOOT_MSG =
          '<div dir="rtl" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#05060e;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px">' +
          '<img src="/assets/logo.png" alt="Parsa Apps" width="84" height="84" onerror="this.style.display=\'none\'" />' +
          '<p style="font-size:18px;font-weight:800;margin:0">Parsa Apps</p>' +
          '<p style="color:rgba(255,255,255,.6);font-size:14px;margin:0">متأسفانه سایت بارگذاری نشد. لطفاً صفحه را دوباره بارگذاری کنید.</p>' +
          '<button onclick="location.reload()" style="margin-top:6px;padding:10px 22px;border:0;border-radius:12px;background:linear-gradient(90deg,#7c5cff,#00c6ff);color:#fff;font-weight:700;font-size:14px;cursor:pointer">بارگذاری مجدد</button>' +
          "</div>";

        function showFallbackIfEmpty() {
          var root = document.getElementById("root");
          if (root && root.children.length === 0) {
            root.innerHTML = BOOT_MSG;
            return true;
          }
          return false;
        }

        function killStuckOverlays() {
          // If root has content but a fixed z-[200] overlay is still stuck (preloader didn't unmount)
          var root = document.getElementById("root");
          if (!root) return;
          // After 7.5s, if we still see a z-[200] overlay and root has more than 1 child or main content exists, force hide overlays
          var overlays = document.querySelectorAll('[class*="z-[200]"]');
          if (overlays.length > 0) {
            // Check if main site content exists behind overlay
            var hasMain = document.querySelector("main") || document.querySelector("header");
            if (hasMain) {
              overlays.forEach(function (el) {
                el.style.opacity = "0";
                el.style.pointerEvents = "none";
                setTimeout(function () {
                  el.style.display = "none";
                }, 800);
              });
            }
          }
        }

        // Guard 1: 6s - if React never mounted, show fallback
        setTimeout(showFallbackIfEmpty, 6000);
        // Guard 2: 8s - second chance
        setTimeout(showFallbackIfEmpty, 8500);
        // Guard 3: 7.5s - if overlay stuck but content exists, kill overlay
        setTimeout(killStuckOverlays, 7500);
        setTimeout(killStuckOverlays, 9500);

        // Global error listener: if chunk load fails, show fallback quickly
        window.addEventListener("error", function (e) {
          var msg = (e && e.message) || "";
          if (msg.indexOf("Loading chunk") !== -1 || msg.indexOf("Failed to fetch") !== -1 || msg.indexOf("Importing a module") !== -1) {
            setTimeout(showFallbackIfEmpty, 1000);
          }
        });

        window.addEventListener("unhandledrejection", function (ev) {
          var reason = ev && ev.reason ? String(ev.reason) : "";
          if (reason.indexOf("Failed to fetch") !== -1 || reason.indexOf("Loading chunk") !== -1 || reason.indexOf("Import") !== -1) {
            setTimeout(showFallbackIfEmpty, 1200);
          }
        });
      })();
    </script>
