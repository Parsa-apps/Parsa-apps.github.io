    <meta name="twitter:image" content="/assets/images/og-cover.jpg" />

    <!-- Fonts (self-hosted Vazirmatn) -->
    <link rel="preload" href="/assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/Vazirmatn-Medium.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Parsa Apps",
        "alternateName": "پارسا اپس",
        "url": "https://parsa-apps.github.io",
        "email": "farshadparsa2019@gmail.com",
        "founder": { "@type": "Person", "name": "Farshad Parsa" },
        "description": "Building the future of mobile experiences. Professional Android & Flutter development powered by modern technology and clean engineering.",
        "sameAs": [
          "https://t.me/Parsaappsadmin",
          "https://instagram.com/parsa_apps"
        ]
      }
    </script>
    <!-- Paint the dark canvas before any CSS arrives (no white flash) -->
    <style>
      html,
      body {
        background: #05060e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Boot guard: if React never mounts (blocked/failed script module,
      // unsupported browser), show a branded notice instead of a blank page.
      window.setTimeout(function () {
        var root = document.getElementById("root");
        if (root && root.children.length === 0) {
          root.innerHTML =
            '<div dir="rtl" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#05060e;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px">' +
            '<img src="/assets/logo.png" alt="Parsa Apps" width="84" height="84" />' +
            '<p style="font-size:18px;font-weight:800;margin:0">Parsa Apps</p>' +
            '<p style="color:rgba(255,255,255,.6);font-size:14px;margin:0">متأسفانه سایت بارگذاری نشد. لطفاً صفحه را دوباره بارگذاری کنید.</p>' +
            '<button onclick="location.reload()" style="margin-top:6px;padding:10px 22px;border:0;border-radius:12px;background:linear-gradient(90deg,#7c5cff,#00c6ff);color:#fff;font-weight:700;font-size:14px;cursor:pointer">بارگذاری مجدد</button>' +
            "</div>";
        }
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
